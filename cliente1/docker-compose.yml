services:
  reverse-proxy:
    image: nginx:latest
    # O nome do container está ótimo, vamos usá-lo no HAProxy.
    container_name: cliente1-proxy
    platform: linux/arm64/v8
    volumes:
      - ./reverse-proxy/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    # ports: <-- SEÇÃO REMOVIDA. O HAProxy cuidará disso.
    #   - "80:80"
    depends_on:
      - portal
      - sign-app
      - hotsite
    restart: always
    networks:
      # Conectado às duas redes: a interna e a compartilhada com o ISP.
      - cliente1-network
      - isp-net

  db:
    image: mysql:8.0
    container_name: cliente1-db
    environment:
      MYSQL_DATABASE: example
      MYSQL_USER: example
      MYSQL_PASSWORD: example
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - cliente1-network

  portal:
    image: wordpress:latest
    container_name: cliente1-portal
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: example
      WORDPRESS_DB_PASSWORD: example
      WORDPRESS_DB_NAME: example
    volumes:
      - portal_data:/var/www/html
    # ports: <-- REMOVIDO
    #   - "8085:80"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - cliente1-network

  hotsite:
    build:
      context: ./hotsite
    container_name: cliente1-hotsite
    expose:
      - "80"
    restart: always
    networks:
      - cliente1-network

  sign-db:
    image: postgres:15-alpine
    container_name: sign-db
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbuserpass123
      POSTGRES_DB: docsign_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d docsign_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cliente1-network

  sign-api:
    image: salesfilho/sign-api:latest
    container_name: sign-api
    environment:
      DB