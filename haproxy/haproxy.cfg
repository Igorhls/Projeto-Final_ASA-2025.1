# Caminho: ./haproxy/haproxy.cfg

global
    log /dev/log    local0
    log /dev/log    local1 notice
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend http_front
    bind *:80
    mode http

    # Regras para identificar o destino com base no domínio da requisição
    acl host_portal hdr(host) -i portal.asa.br
    acl host_webmail hdr(host) -i webmail.asa.br
    acl host_cliente1 hdr(host) -i cliente1.localhost
    acl host_cliente2 hdr(host) -i cliente2.localhost
    acl host_cliente3 hdr(host) -i cliente3.localhost

    # Ação a ser tomada com base na regra correspondente
    use_backend portal_backend if host_portal
    use_backend webmail_backend if host_webmail
    use_backend cliente1_backend if host_cliente1
    use_backend cliente2_backend if host_cliente2
    use_backend cliente3_backend if host_cliente3
    
    # Se nenhum domínio corresponder, envia para o portal principal
    default_backend portal_backend

# --- Backends (para onde o tráfego será enviado) ---

backend portal_backend
    mode http
    server portal_server portal:80 check

backend webmail_backend
    mode http
    server webmail_server webmail:80 check

backend cliente1_backend
    mode http
    # CORRIGIDO para usar o nome do container do docker-compose do cliente 1
    server srv_cliente1 cliente1-proxy:80 check

backend cliente2_backend
    mode http
    # CORRIGIDO para usar o nome do container do docker-compose do cliente 2
    server srv_cliente2 cliente2-proxy:80 check

backend cliente3_backend
    mode http
    # CORRIGIDO para usar o nome do container do docker-compose do cliente 3
    server srv_cliente3 cliente3-proxy:80 check